<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinch — splash</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark|light to force a theme, ?loop to repeat the animation for review
  var q = new URLSearchParams(location.search);
  if (q.get('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
  if (q.has('loop')) document.documentElement.classList.add('loop');
</script>
<style>
  /* Total run: 4.2s. In the app, play once and fade out as soon as data is ready
     (but no sooner than ~2.8s so the shake + wordmark land). */
  :root { --splash-dur: 4.2s; --splash-iter: 1; }
  .loop { --splash-iter: infinite; }

  html, body { height: 100%; margin: 0; }
  body { background: var(--brand-green); font-family: var(--font); display: grid; place-items: center; }

  .splash { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .stage { position: relative; width: 240px; height: 190px; animation: rise var(--splash-dur) ease-out var(--splash-iter) both; }
  .shaker { position: absolute; top: 40px; width: 42px; height: 108px; transform-origin: 50% 100%; }
  .shaker svg { display: block; }
  .salt { left: 28px; animation: salt var(--splash-dur) cubic-bezier(.4,0,.2,1) var(--splash-iter) both; }
  .pepper { left: 170px; animation: pepper var(--splash-dur) cubic-bezier(.4,0,.2,1) var(--splash-iter) both; }
  .grain { position: absolute; width: 4px; height: 4px; opacity: 0;
           animation: fall var(--splash-dur) cubic-bezier(.5,0,.9,.6) var(--splash-iter) both; }
  .grain.s { background: var(--brand-salt); border-radius: 1px; }
  .grain.p { background: var(--brand-pepper); border-radius: 50%; }
  .grain.lg { width: 5px; height: 5px; }
  .word { font-weight: 700; letter-spacing: -0.03em; font-size: 44px; line-height: 1; color: var(--brand-salt);
          opacity: 0; animation: word var(--splash-dur) ease-out var(--splash-iter) both; }
  .track { width: 120px; height: 3px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--brand-salt) 22%, transparent); }
  .bar { height: 100%; width: 0; border-radius: 2px; background: var(--brand-salt); animation: load var(--splash-dur) ease-in-out var(--splash-iter) both; }

  @keyframes rise   { 0% { opacity: 0; transform: translateY(18px); } 12% { opacity: 1; transform: none; } 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes salt   { 0%,16% { transform: rotate(0); } 26% { transform: rotate(26deg); } 31% { transform: rotate(20deg); } 36% { transform: rotate(27deg); }
                      41% { transform: rotate(20deg); } 46% { transform: rotate(26deg); } 56%,100% { transform: rotate(0); } }
  @keyframes pepper { 0%,16% { transform: rotate(0); } 26% { transform: rotate(-26deg); } 31% { transform: rotate(-20deg); } 36% { transform: rotate(-27deg); }
                      41% { transform: rotate(-20deg); } 46% { transform: rotate(-26deg); } 56%,100% { transform: rotate(0); } }
  @keyframes fall   { 0%,27% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 52% { opacity: 1; } 62%,100% { opacity: 0; transform: translateY(104px); } }
  @keyframes word   { 0%,54% { opacity: 0; transform: translateY(10px); } 66%,94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @keyframes load   { 0%,10% { width: 0; } 90%,100% { width: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .stage, .shaker, .grain, .bar { animation: none; }
    .stage { opacity: 1; }
    .word { animation: none; opacity: 1; }
    .bar { width: 60%; }
  }
</style>
</head>
<body>
  <main class="splash" role="img" aria-label="Pinch is loading">
    <div class="stage" aria-hidden="true">
      <div class="shaker salt">
        <svg width="42" height="108" viewBox="0 0 42 108">
          <rect x="2" y="0" width="38" height="32" rx="16" style="fill:var(--brand-salt)"/>
          <rect x="0" y="22" width="42" height="86" rx="12" style="fill:var(--brand-salt)"/>
          <rect x="0" y="22" width="42" height="6" style="fill:var(--brand-green)"/>
          <circle cx="12" cy="13" r="2.8" style="fill:var(--brand-green)"/><circle cx="21" cy="8" r="2.8" style="fill:var(--brand-green)"/><circle cx="30" cy="13" r="2.8" style="fill:var(--brand-green)"/>
        </svg>
      </div>
      <div class="shaker pepper">
        <svg width="42" height="108" viewBox="0 0 42 108">
          <rect x="2" y="0" width="38" height="32" rx="16" style="fill:var(--brand-pepper)"/>
          <rect x="0" y="22" width="42" height="86" rx="12" style="fill:var(--brand-pepper)"/>
          <rect x="0" y="22" width="42" height="6" style="fill:var(--brand-green)"/>
          <circle cx="16" cy="11" r="2.8" style="fill:var(--brand-green)"/><circle cx="26" cy="11" r="2.8" style="fill:var(--brand-green)"/>
        </svg>
      </div>
      <i class="grain s lg" style="left:100px;top:62px;animation-delay:0s"></i>
      <i class="grain s"    style="left:108px;top:58px;animation-delay:.12s"></i>
      <i class="grain s"    style="left:96px;top:66px;animation-delay:.26s"></i>
      <i class="grain s lg" style="left:104px;top:60px;animation-delay:.4s"></i>
      <i class="grain p lg" style="left:136px;top:62px;animation-delay:.06s"></i>
      <i class="grain p"    style="left:128px;top:58px;animation-delay:.2s"></i>
      <i class="grain p"    style="left:140px;top:66px;animation-delay:.32s"></i>
      <i class="grain p lg" style="left:132px;top:60px;animation-delay:.46s"></i>
    </div>
    <div class="word">Pinch</div>
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
  </main>
</body>
</html>
